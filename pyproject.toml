[project]
name = "model-adaptation"
version = "1.0.0"
description = "Project to teach an LLM to \"translate\" text to SQL"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch==2.11.0",
    "transformers==5.13.1",
    "datasets==5.0.0",
    "peft==0.19.1",
    "boto3==1.42.73",
    "wandb>=0.31.0",
    "weave>=0.53.10",
    "opentelemetry-exporter-otlp-proto-http==1.44.0",
    "sagemaker-core>=2.17.0",
    "sagemaker-train>=1.17.0",
    "nltk>=3.10.4",
]

[tool.uv.sources]
torch = { index = "pytorch" }

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
